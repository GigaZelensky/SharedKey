name: Check and build

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests and browser regressions
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Read Vencord revision for UI component tests
              id: ui-version
              run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + require('./vencord.json').commit + '\n')"
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: Vendicated/Vencord
                  ref: ${{ steps.ui-version.outputs.commit }}
                  path: .vencord
                  persist-credentials: false
            - run: npm run format:check
            - run: npm test
            - run: npm run test:browser

    windows:
        name: Vencord integration and Windows package
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Read supported Vencord revision
              id: version
              shell: pwsh
              run: |
                  $configuration = Get-Content vencord.json -Raw | ConvertFrom-Json
                  "commit=$($configuration.commit)" >> $env:GITHUB_OUTPUT
                  "pnpm=$($configuration.pnpmVersion)" >> $env:GITHUB_OUTPUT
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: Vendicated/Vencord
                  ref: ${{ steps.version.outputs.commit }}
                  path: .vencord
                  persist-credentials: false
            - run: npm install --global pnpm@${{ steps.version.outputs.pnpm }}
            - run: pnpm --dir .vencord install --frozen-lockfile
            - run: npm run check:vencord
            - run: npm run build
            - run: npm run package
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: SharedKey-Windows-${{ github.sha }}
                  path: artifacts/SharedKey-friend-kit/
                  if-no-files-found: error
                  retention-days: 14
